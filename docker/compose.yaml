name: ediff

x-ediff-common: &ediff-common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: ediff:latest
  environment:
    EDIFF_ARTIFACT_DIR: /artifacts
    EDIFF_ARCHIVE_DATASETS: "0"
    OMP_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
  volumes:
    - ediff-artifacts:/artifacts
  init: true

services:
  quick:
    <<: *ediff-common
    profiles: ["quick"]
    command: ["bash", "run_quick.sh", "--regenerate-datasets", "--seeds", "11"]

  extended:
    <<: *ediff-common
    profiles: ["extended"]
    command:
      ["bash", "run_extended.sh", "--regenerate-datasets", "--seeds", "11,17,23,31,37,43,53,61"]

  sota:
    <<: *ediff-common
    profiles: ["sota"]
    command:
      ["bash", "sota.sh", "--regenerate-datasets", "--seeds", "11,17,23,31,37,43,53,61"]

volumes:
  ediff-artifacts:
