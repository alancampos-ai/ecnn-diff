apiVersion: batch/v1
kind: Job
metadata:
  name: ediff-quick
  labels:
    app.kubernetes.io/name: ediff
    app.kubernetes.io/component: smoke-validation
    app.kubernetes.io/part-of: ediff
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ediff
        app.kubernetes.io/component: smoke-validation
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ediff
          image: ediff:latest
          imagePullPolicy: IfNotPresent
          workingDir: /app
          args:
            - bash
            - run_quick.sh
            - --regenerate-datasets
            - --seeds
            - "11"
          env:
            - name: EDIFF_ARTIFACT_DIR
              value: /artifacts
            - name: EDIFF_ARCHIVE_DATASETS
              value: "0"
            - name: OMP_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: MKL_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: ediff-artifacts
